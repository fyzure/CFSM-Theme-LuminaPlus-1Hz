name: Static Check

on:
  push:
    branches:
      - me/v127-3hz
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/index-D3CXpQAE.js
      - name: Check 3 Hz pacing constants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bundle = fs.readFileSync('assets/index-D3CXpQAE.js', 'utf8');
          const expected = 'Ta=333,Ea=3e3,Da=333,Oa=8';
          if (!bundle.includes(expected)) {
            console.error('3 Hz pacing constants are missing');
            process.exit(1);
          }
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('LuminaPlus v1.2.7+3hz-do-hibernate')) {
            console.error('3 Hz theme version marker is missing');
            process.exit(1);
          }
          NODE
